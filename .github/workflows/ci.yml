name: CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: expense_tracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: expense_tracker
          DB_USERNAME: root
          DB_PASSWORD: root
          JPA_DDL_AUTO: create-drop
          JWT_SECRET: ci-only-secret-key-that-is-at-least-32-characters-long
          CORS_ALLOWED_ORIGIN: http://localhost:5173
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build
